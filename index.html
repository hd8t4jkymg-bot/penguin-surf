<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
</head>
<body style="margin:0;">
<script>
  let penguin, water, wave, crests = [], score = 0, scoreText;
  let waveX = -120, over = false;

  const config = {
    type: Phaser.AUTO,
    width: 400,
    height: 600,
    backgroundColor: '#8fd3f4',
    physics: { default: 'arcade', arcade: { gravity: { y: 900 } } },
    scene: { create: create, update: update }
  };

  function create() {
    score = 0;
    waveX = -120;
    over = false;
    crests = [];

    water = this.add.rectangle(200, 520, 400, 160, 0x1e6fb8);
    this.physics.add.existing(water, true);

    // The chasing wave, behind the penguin
    wave = this.add.rectangle(waveX, 470, 140, 260, 0x4fb3d9);

    penguin = this.add.rectangle(100, 400, 30, 40, 0x222222);
    this.physics.add.existing(penguin);
    penguin.body.setCollideWorldBounds(true);
    this.physics.add.collider(penguin, water);

    for (let i = 0; i < 8; i++) {
      crests.push(this.add.rectangle(i * 60, 445, 30, 6, 0xffffff));
    }

    scoreText = this.add.text(16, 16, 'Score: 0', { fontSize: '24px', color: '#ffffff' });

    this.input.on('pointerdown', () => {
      if (over) {
        this.scene.restart();
        return;
      }
      if (penguin.body.touching.down) {
        penguin.body.setVelocityY(-450);
      }
    });
  }

  function update(time, delta) {
    if (over) return;

    // Move the wave forward toward the penguin
    waveX += 0.04 * delta;
    wave.x = waveX;

    // The wave catches the penguin: game over
    if (wave.x + 70 > penguin.x - 15) {
      over = true;
      this.physics.pause();
      this.add.text(200, 280, 'Wiped out!', { fontSize: '32px', color: '#ffffff' }).setOrigin(0.5);
      this.add.text(200, 320, 'Tap to restart', { fontSize: '20px', color: '#ffffff' }).setOrigin(0.5);
      return;
    }

    crests.forEach(c => {
      c.x -= 0.2 * delta;
      if (c.x < -30) c.x = 430;
    });

    if (penguin.body.touching.down) {
      score += delta / 100;
      scoreText.setText('Score: ' + Math.floor(score));
    }
  }

  new Phaser.Game(config);
</script>
</body>
</html>
